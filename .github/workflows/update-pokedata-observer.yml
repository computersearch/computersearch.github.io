name: Update Pokédata observer
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokedata-observer
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch standings JSON
        run: python tools/fetch_pokedata_observer.py
      - name: Commit observer snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observer/data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Pokédata observer snapshots'
            git push
          fi
