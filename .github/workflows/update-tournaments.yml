name: Update tournament data
on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: 'Tournament ID (515 = 2026 World Championships; blank = latest Regionals)'
        required: false
        type: string
  schedule:
    - cron: '25 6 * * *'
permissions:
  contents: write
concurrency:
  group: tournament-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install downloader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch and validate LimitlessTCG tournament data
        env:
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
        run: |
          if [ -n "$TOURNAMENT_ID" ]; then
            python tools/import_limitless.py --tournament-id "$TOURNAMENT_ID" --max-decks 120
          else
            python tools/import_limitless.py --max-decks 100
          fi
      - name: Commit verified tournament snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournaments/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified tournament data"
            git push
          else
            echo "No tournament updates"
          fi
