name: Update tournament data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'
permissions:
  contents: write
concurrency:
  group: tournament-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch and validate Ciphermaniac tournament data
        run: python tools/import_ciphermaniac.py
      - name: Commit verified tournament snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournaments/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified tournament data"
            git push
          else
            echo "No tournament updates"
          fi
