name: Update Limitless metagame rankings
on:
  workflow_dispatch:
  schedule:
    # Run daily at 07:00 UTC.
    - cron: '0 7 * * *'
permissions:
  contents: write
concurrency:
  group: metagame-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Update metagame snapshot
        run: python tools/fetch_limitless_metagame.py
      - name: Commit only changed ranking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metagame/rankings.json
          if git diff --cached --quiet; then
            echo "No metagame changes"
            exit 0
          fi
          git commit -m "Update Limitless metagame rankings"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict; aborting" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Could not push metagame snapshot" >&2
          exit 1
