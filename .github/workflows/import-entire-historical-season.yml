name: Import entire historical Regional season

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Import every discovered Regional from this season"
        required: true
        type: choice
        options:
          - "2025-26"
          - "2024-25"
          - "2023-24"
          - "2026-27"

permissions:
  contents: write

concurrency:
  group: tournament-import
  cancel-in-progress: false

jobs:
  import-season:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Discover all Regional IDs in selected season
        env:
          SEASON: ${{ inputs.season }}
        run: python tools/discover_historical_regionals.py --season "$SEASON" --output historical-regional-ids.json
      - name: Fully import all discovered Regionals
        id: import
        continue-on-error: true
        env:
          SEASON: ${{ inputs.season }}
        run: python tools/import_full_historical_season.py --season "$SEASON" --discovered-file historical-regional-ids.json
      - name: Commit successful imports (even if some events failed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournaments/
          if ! git diff --cached --quiet; then
            git commit -m "Backfill complete historical Regional season"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            echo "Unable to push after five attempts" >&2
            exit 1
          else
            echo "No tournament data to commit"
          fi
      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-season-report
          path: |
            historical-import-summary.txt
            historical-regional-ids.json
          if-no-files-found: ignore
      - name: Report total import failure
        if: steps.import.outcome == 'failure'
        run: |
          echo "All imports failed or importer errored; inspect the logs and uploaded report." >&2
          exit 1
